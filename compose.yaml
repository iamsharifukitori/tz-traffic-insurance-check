x-app: &app
  image: fleet-monitor:local
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
  environment: &environment
    DATABASE_URL: postgresql+psycopg://fleet:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/fleet
    API_KEY: ${API_KEY:?Set API_KEY}
    DATA_DIR: /data
    EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-true}
    EMAIL_FROM: ${EMAIL_FROM:-fleet@example.invalid}
    EMAIL_TO: ${EMAIL_TO:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_MODE: ${SMTP_MODE:-starttls}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    OFFENCE_DEADLINE_DAYS: ${OFFENCE_DEADLINE_DAYS:-7}
    BROWSER_SANDBOX: "true"
  volumes:
    - fleet_data:/data
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_DB: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/v1/health',headers={'Authorization':'Bearer '+os.environ['API_KEY']}); urllib.request.urlopen(r,timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "fleet.worker"]
    shm_size: 1gb
    security_opt:
      - seccomp=./deploy/chromium-seccomp.json

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?Set API_HOST}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: fleet
      PGDATABASE: fleet
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: Africa/Dar_es_Salaam
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    command: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'test -f /backups/last-success && test "$$(($$(date +%s) - $$(cat /backups/last-success)))" -lt 129600']
      interval: 1h
      timeout: 5s
      retries: 1

volumes:
  postgres_data:
  fleet_data:
  caddy_data:
  caddy_config:
